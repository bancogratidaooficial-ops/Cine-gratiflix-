<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINE GRATIFLIX</title>
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icone.png">
<meta name="theme-color" content="#ff0000">
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial}
.top{background:#000;padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff0000;position:sticky;top:0;z-index:10}
.logo{font-weight:900} .logo b{color:#ff0000}
.hero{padding:20px 16px;background:linear-gradient(180deg,#1a0000,#050505)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#111;border-radius:18px;overflow:hidden;border:1px solid #222;cursor:pointer}
.card img{width:100%;height:210px;object-fit:cover;background:#222}
.tag{position:absolute;margin:8px;background:#000d;color:#00ff88;font-size:9px;padding:5px 8px;border-radius:8px;font-weight:900}
.info{padding:10px}
#paywall{position:fixed;inset:0;background:#000000f5;z-index:99;display:none;align-items:flex-end}
.paybox{background:#121212;width:100%;border-radius:28px 28px 0 0;padding:20px;max-height:92vh;overflow:auto}
.pixqr{background:#fff;padding:12px;border-radius:16px;text-align:center;margin:12px 0}
.codbox{background:#000;border:2px dashed #ffcc00;padding:14px;border-radius:14px;text-align:center;margin-top:10px}
#player{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#player iframe{width:100%;height:100%;border:none}
.inputCod{flex:1;padding:14px;border-radius:30px;border:1px solid #333;background:#000;color:#fff;text-align:center;font-weight:900}
</style>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}</script>
</head>
<body>
<div class="top"><div class="logo">🎬 CINE <b>GRATIFLIX</b></div><div onclick="location.href='./admin.html'" style="font-size:11px;color:#555">ADMIN</div></div>

<div class="hero">
<h1 style="margin:0 0 8px 0">Comece grátis.<br>Fique para as histórias.</h1>
<p style="color:#888;margin:0 0 12px 0">Domínio público e Creative Commons. 3h grátis, depois R$2,99/mês.</p>
<small id="timer" style="color:#ffcc00;display:block;margin-bottom:14px">⏳ Grátis: <span id="tempo">03:00:00</span></small>

<!-- CAMPO DE CÓDIGO SEMPRE VISÍVEL - CORREÇÃO DO SEU ERRO -->
<div style="background:#111;padding:12px;border-radius:16px;border:1px solid #222">
<small style="color:#ffcc00;font-weight:900">🎟️ JÁ TEM CÓDIGO CINE? LIBERE AQUI:</small>
<div style="display:flex;gap:8px;margin-top:8px">
<input id="inputCodigoTopo" class="inputCod" placeholder="CINE-XXXX-XXXX">
<button onclick="validarCodigoTopo()" style="background:#00ff88;color:#000;border:none;padding:14px 18px;border-radius:30px;font-weight:900">LIBERAR</button>
</div>
<small id="statusCodigo" style="color:#666;display:block;margin-top:6px"></small>
</div>
</div>

<div id="areaFilmes"><div class="grid" id="grid"></div></div>

<div id="player">
<div style="padding:12px;background:#000;display:flex;justify-content:space-between"><b id="playerTitle"></b><button onclick="document.getElementById('player').style.display='none'" style="background:#222;color:#fff;border:none;padding:10px 14px;border-radius:20px">✕ Fechar</button></div>
<div id="playerBox" style="flex:1;background:#000"></div>
</div>

<div id="paywall">
<div class="paybox">
<div style="display:flex;justify-content:space-between"><div>🔒 CONTEÚDO BLOQUEADO</div><div onclick="document.getElementById('paywall').style.display='none'" style="font-size:22px">✕</div></div>
<h2>Seu tempo grátis acabou</h2>
<div class="pixqr"><img id="qrPix" width="200" height="200"><br><b style="color:#000">Pix CPF: 025.446.319-37</b></div>
<button onclick="copiarPix()" style="width:100%;background:#ffcc00;color:#000;padding:14px;border-radius:30px;font-weight:900;border:none">📋 COPIAR CPF</button>
<div id="areaCodigo" class="codbox" style="display:none"><div id="codigoGerado"></div></div>
<div style="margin-top:16px">
<div id="antesPago">
<button onclick="enviarPedidoGrupo()" style="width:100%;background:#25D366;color:#fff;padding:16px;border-radius:30px;font-weight:900;border:none">📤 JÁ FIZ O PIX - ENVIAR COMPROVANTE NO GRUPO</button>
<div style="margin-top:16px"><small style="color:#888">OU COLE SEU CÓDIGO AQUI:</small>
<div style="display:flex;gap:8px;margin-top:6px"><input id="inputCodigo" class="inputCod" placeholder="CINE-XXXX-XXXX"><button onclick="validarCodigo()" style="background:#fff;color:#000;border:none;padding:14px 18px;border-radius:30px;font-weight:900">LIBERAR</button></div></div>
</div>
<div id="depoisPago" style="display:none;text-align:center"><h2 style="color:#00ff88">✅ LIBERADO!</h2><p id="codFinal"></p><button onclick="location.reload()" style="width:100%;background:#00ff88;color:#000;padding:16px;border-radius:30px;font-weight:900;border:none">ASSISTIR AGORA</button></div>
</div>
</div>
</div>

<script>
const LINK_GRUPO="https://chat.whatsapp.com/BtNurXoNfsg2VVuQb8Tasc";
const filmesPadrao=[
{t:"Tempos Modernos",ano:"1936",tag:"DOMÍNIO PÚBLICO",img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400",video:"https://www.youtube.com/embed/HAaZ1q1v2Is"},
{t:"A Noite dos Mortos-Vivos",ano:"1968",tag:"DOMÍNIO PÚBLICO",img:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400",video:"https://archive.org/embed/night_of_the_living_dead"},
{t:"O Grande Ditador",ano:"1940",tag:"DOMÍNIO PÚBLICO",img:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=400",video:"https://www.youtube.com/embed/U9L2o2p4a2k"}
];

function render(filmes){
 window.todosFilmes=filmes;
 document.getElementById('grid').innerHTML=filmes.map((f,i)=>`<div class="card" onclick="abrirPlayer(${i})"><div style="position:relative"><span class="tag">${f.tag}</span><img src="${f.img}" onerror="this.src='https://via.placeholder.com/300x210?text=CINE'"></div><div class="info"><b>${f.t}</b><br><small style="color:#888">${f.ano}</small></div></div>`).join('');
}

let filmesIniciais = JSON.parse(localStorage.getItem('cine_filmes')||'null');
if(filmesIniciais && filmesIniciais.length>0){ render(filmesIniciais); } else { render(filmesPadrao); }

fetch('./filmes.json').then(r=>r.json()).then(j=>{ if(j && j.length>0){ render(j); } }).catch(()=>{});

function abrirPlayer(i){
 if(!pago && tempo<=0){document.getElementById('paywall').style.display='flex';return}
 let f=window.todosFilmes[i];
 document.getElementById('playerTitle').innerText=f.t;
 document.getElementById('playerBox').innerHTML=`<iframe src="${f.video}" allowfullscreen></iframe>`;
 document.getElementById('player').style.display='flex';
}

function geraPix(){let b="00020126580014BR.GOV.BCB.PIX01110254463193752040000530398654042.995802BR5913BANCO GRATIDAO6009CURITIBA62070503***6304";function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?(c<<1)^0x1021:c<<1;c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}return b+crc(b+"6304")}
document.getElementById('qrPix').src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(geraPix());

let tempo=parseInt(localStorage.getItem('cine_t')||10800);
let pago=localStorage.getItem('cine_pago')==='true';
let timerEl=document.getElementById('tempo');
let statusEl=document.getElementById('statusCodigo');
if(pago){document.getElementById('timer').innerHTML='✅ PREMIUM ATIVO • '+localStorage.getItem('cine_code');statusEl.innerText='✅ Código ativo: '+localStorage.getItem('cine_code');statusEl.style.color='#0f8'}

setInterval(()=>{
 if(pago) return;
 if(tempo<=0){document.getElementById('paywall').style.display='flex';timerEl.innerText='00:00:00 - BLOQUEADO';return}
 tempo--;localStorage.setItem('cine_t',tempo);
 let h=Math.floor(tempo/3600),m=Math.floor((tempo%3600)/60),s=tempo%60;
 timerEl.innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
},1000);

function copiarPix(){navigator.clipboard.writeText('025.446.319-37');alert('CPF copiado')}

function enviarPedidoGrupo(){
 let wpp=prompt('Seu WhatsApp:'); if(!wpp) return;
 let nome=prompt('Seu nome:')||'Cliente';
 let id='CINE-'+Date.now().toString().slice(-6);
 let p=JSON.parse(localStorage.getItem('cine_pedidos')||'[]');p.push({id,nome,wpp,data:new Date().toLocaleString(),status:'pendente'});localStorage.setItem('cine_pedidos',JSON.stringify(p));
 let msg=`🎬 COMPROVANTE CINE GRATIFLIX\n\nID: ${id}\nNome: ${nome}\nWPP: ${wpp}\nValor: R$2,99 Pix CPF 025.446.319-37\nData: ${new Date().toLocaleString()}\n\nAnexei comprovante abaixo 👇`;
 navigator.clipboard.writeText(msg).then(()=>{alert('Pedido '+id+' copiado! Entrando no grupo');window.open(LINK_GRUPO,'_blank');document.getElementById('areaCodigo').style.display='block';document.getElementById('codigoGerado').innerHTML=`Pedido <b>${id}</b><br><small>Cole no grupo + print</small><br><button onclick="window.open('${LINK_GRUPO}','_blank')" style="background:#25D366;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:900;margin-top:8px">ABRIR GRUPO</button>`;let iv=setInterval(()=>{let l=JSON.parse(localStorage.getItem('cine_liberados')||'{}');if(l[id]){clearInterval(iv);liberar(l[id])}},3000)});
}

function liberar(codigo){localStorage.setItem('cine_pago','true');localStorage.setItem('cine_code',codigo);alert('✅ LIBERADO! Código: '+codigo);location.reload()}
function validarCodigo(){let c=document.getElementById('inputCodigo').value.toUpperCase().trim();if(c.startsWith('CINE-')){liberar(c)}else alert('Código inválido')}
function validarCodigoTopo(){let c=document.getElementById('inputCodigoTopo').value.toUpperCase().trim();if(c.startsWith('CINE-')&&c.length>=8){liberar(c)}else{statusEl.innerText='❌ Código inválido, use CINE-XXXX-XXXX';statusEl.style.color='#f55'}}
</script>
</body>
</html>
